<VirtualHost *:80>
	ServerName pods.artiswrong.com
	ServerAdmin alex@alexhornstein.com

	DocumentRoot /home/japhy/pods.artiswrong.com
	<Directory /home/japhy/pods.artiswrong.com>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# --- Same-origin reverse proxy to Omnipod's recall checker ---------------
	# The browser can't fetch omnipod.com directly (no CORS headers there), so
	# Apache fetches it server-to-server and relays the real 200/404/302 status.
	# Scoped to ONLY the MDC-5-26 check endpoint so this isn't an open proxy.
	#   /pod-lot/affected?pod_lot=X      -> 200 affected, 404 not on list
	#   /pod-lot/not-affected?pod_lot=X  -> 200 clear,    302 unknown lot
	SSLProxyEngine On
	ProxyRequests Off
	ProxyPreserveHost Off
	ProxyPass        /pod-lot/ https://www.omnipod.com/mdc-5-26/check-pod-lot/
	ProxyPassReverse /pod-lot/ https://www.omnipod.com/mdc-5-26/check-pod-lot/

	# Log the request PATH only (%U), never the query string — so scanned lot
	# numbers (?pod_lot=...) are never written to disk. Keeps the site's
	# "we don't store anything about your Pods" promise literally true.
	ErrorLog /home/japhy/logs/pods.artiswrong.com-error.log
	LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" noquery
	CustomLog /home/japhy/logs/pods.artiswrong.com-access.log noquery

	# NOTE: no http->https redirect here on purpose — `certbot --apache` needs
	# plain HTTP for its ACME challenge, and will add the redirect for you.
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
